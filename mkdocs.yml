site_name: interconnection-gym
site_description: Batch interconnection of large loads as a multi-agent game
site_url: https://mhaomou.github.io/interconnection-gym/docs/
repo_url: https://github.com/MhaoMou/interconnection-gym
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
nav:
  - Home: index.md
  - Model and theory: theory.md
  - Comparing rules: operators.md
  - Regions from a network: networks.md
  - Environments and benchmarks: researchers.md
  - Data and licenses: data.md
  - Development: development.md
  - API reference:
      - api/index.md
      - Core: api/core.md
      - Extensions: api/extensions.md
      - Networks and data: api/networks.md
      - Environments: api/environments.md
      - Tools: api/tools.md
markdown_extensions:
  - tables
  - admonition
  - toc: {permalink: true}
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: true
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2
