name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
      - run: pytest -q

  full:
    name: full tests with environments (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are not available to this repository (jobs are cancelled
        # before starting); the full suite is run on macOS before each release.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[envs,test]"
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check src tests scripts examples

  package:
    name: wheel and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build "mkdocs-material>=9.5,<10" "mkdocstrings[python]>=0.26"
      - run: mkdocs build --strict
      - run: python -m build
      - run: python scripts/check_wheel.py dist/*.whl
      - name: tests against the installed wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install "$(ls dist/*.whl)[envs,test]"
          mkdir -p /tmp/wheel-check && cp -r tests examples /tmp/wheel-check/
          cd /tmp/wheel-check && /tmp/wheel-env/bin/python -m pytest -q -p no:cacheprovider tests
